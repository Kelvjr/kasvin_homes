services:
  postgres:
    image: postgres:17
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: kasvin
      POSTGRES_PASSWORD: kasvin_local_only
      POSTGRES_DB: kasvin_dev
    volumes:
      - kasvin_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kasvin -d kasvin_dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kasvin_pg_data:
